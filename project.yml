name: Synthesis
options:
  bundleIdPrefix: com.jayden77
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"  # iPhone only
    PRODUCT_BUNDLE_IDENTIFIER: com.jayden77.posture

targets:
  Synthesis:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_NAME: Synthesis
        CODE_SIGN_ENTITLEMENTS: Synthesis.entitlements
    dependencies:
      - sdk: HealthKit.framework

  SynthesisTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: Synthesis
