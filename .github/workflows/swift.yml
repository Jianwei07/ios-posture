# Repo is XcodeGen-managed (project.yml -> Synthesis.xcodeproj), not an SPM
# package — there is no Package.swift, so `swift build`/`swift test` can
# never work here. Generate the project, then build/test with xcodebuild.
name: Swift

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.app
    - name: Install XcodeGen
      run: brew install xcodegen
    - name: Generate project
      run: xcodegen generate
    - name: Check generated project is committed
      run: git diff --exit-code Synthesis.xcodeproj
    - name: Build (macOS)
      run: xcodebuild -project Synthesis.xcodeproj -scheme SynthesisMac -destination 'platform=macOS' build
    - name: Test (macOS, native)
      run: xcodebuild -project Synthesis.xcodeproj -scheme SynthesisMac -destination 'platform=macOS' test
    - name: Build (iOS Simulator)
      run: xcodebuild -project Synthesis.xcodeproj -scheme Synthesis -destination 'generic/platform=iOS Simulator' build
